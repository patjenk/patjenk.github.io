<title>Bruce Street Block Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@500&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: the city plat sits fixed on the left with the Top 5 and owned land beside it; future opportunities run full width below.
   Color follows plat practice: red pencil marks priorities, blue pencil marks future opportunities, green marks land CJ Park holds. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --ink: #1c2320;
  --muted: #5b6661;
  --rule: #cfd5d1;
  --owned: #1d7a4c;
  --priority: #c4252f;
  --target: #2259b8;
  --focus: #e0a400;
  --select: #ffbf00;
  --select-edge: #a87400;
  --chip-ink: #ffffff;
  --plat-filter: none;
  --shadow: 0 10px 30px rgb(20 30 25 / 0.18);
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
/* The page stays white in every theme, to match the printed handout. */
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }
header { display: grid; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-stretch: 78%; font-weight: 800; font-size: clamp(28px, 4.2vw, 44px); line-height: 1.05; margin: 0; }
h1 .keep { white-space: nowrap; }
.lede { margin: 4px 0 0; font-size: 16px; }

.layout { display: grid; grid-template-columns: minmax(0, 760px) minmax(280px, 1fr); grid-template-areas: "map side" "more more"; gap: 20px; align-items: start; }
.map-card { grid-area: map; }
.side { grid-area: side; display: grid; gap: 18px; min-width: 0; }
.more { grid-area: more; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "map" "side" "more"; }
}

.map-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; position: relative; min-width: 0; }
.layers { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.layer { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 8px; border: 1px solid var(--rule); border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; user-select: none; background: var(--surface); color: var(--ink); position: relative; }
.layer input { position: absolute; opacity: 0; pointer-events: none; }
.layer .sw { width: 14px; height: 14px; border-radius: 3px; border: 2px solid currentColor; }
.layer[data-layer="owned"] .sw { color: var(--owned); background: var(--owned); }
.layer[data-layer="priority"] .sw { color: var(--priority); background: var(--priority); }
.layer[data-layer="target"] .sw { color: var(--target); background: repeating-linear-gradient(135deg, var(--target) 0 2px, transparent 2px 5px); }
.layer .count { font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-size: 12px; }
.layer:has(input:not(:checked)) { opacity: 0.5; }
.layer:has(input:not(:checked)) .sw { background: transparent; }
.layer:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }

.stage { position: relative; padding: 4px; }
svg#plat { display: block; width: 100%; height: auto; user-select: none; }
#plat image { filter: var(--plat-filter); }
.street { fill: var(--muted); font: 600 30px var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; text-anchor: middle; dominant-baseline: central; }
.lot { fill: transparent; stroke: transparent; stroke-width: 2; cursor: pointer; vector-effect: non-scaling-stroke; }
.lot:hover { stroke: var(--ink); stroke-width: 2; }
.lot.owned { fill: color-mix(in srgb, var(--owned) 45%, transparent); stroke: var(--owned); }
.lot.priority { fill: color-mix(in srgb, var(--priority) 38%, transparent); stroke: var(--priority); stroke-width: 2.5; }
.lot.target { fill: url(#hatch); stroke: var(--target); }
.hide-owned .lot.owned, .hide-priority .lot.priority, .hide-target .lot.target { fill: transparent; stroke: transparent; }
.hide-priority .badge { display: none; }
/* Selection: the rest of the plat fades back and the chosen lot gets a gold outline with a soft, pulsing gold glow. */
#plat image, .lot, .badge { transition: opacity 0.15s; }
svg.has-selection #plat-image { opacity: 0.4; }
svg.has-selection .lot:not(.selected), svg.has-selection .badge:not(.selected) { opacity: 0.3; }
.sel-glow, .sel-edge, .sel-line { fill: none; stroke-linejoin: round; pointer-events: none; }
.sel-glow { stroke: var(--select); stroke-width: 34; filter: url(#glow); animation: sel-pulse 1.6s ease-in-out infinite; }
.sel-edge { stroke: var(--select-edge); stroke-width: 7; vector-effect: non-scaling-stroke; }
.sel-line { stroke: var(--select); stroke-width: 4.5; vector-effect: non-scaling-stroke; }
@keyframes sel-pulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) {
  #plat image, .lot, .badge { transition: none; }
  .sel-glow { animation: none; opacity: 0.75; }
}
.lot:focus-visible { outline: none; stroke: var(--focus); stroke-width: 4; }
.badge { pointer-events: none; }
.badge circle { fill: var(--priority); stroke: var(--surface); stroke-width: 3; }
.badge text { fill: var(--chip-ink); font: 700 26px var(--font-display); text-anchor: middle; dominant-baseline: central; }
.hatch-line { stroke: var(--target); stroke-width: 3; }
.hatch-bg { fill: color-mix(in srgb, var(--target) 12%, transparent); }
.hint { margin: 0; padding: 8px 12px 10px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); }

.pop { position: absolute; z-index: 5; width: min(340px, calc(100% - 20px)); background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); padding: 14px 16px 16px; display: grid; gap: 10px; }
.pop-head { display: grid; gap: 4px; padding-right: 30px; }
.pop h2 { font: 800 22px/1.1 var(--font-display); font-stretch: 85%; margin: 0; }
.pop .blocklot { font: 500 12px var(--font-mono); color: var(--muted); }
.pop-close { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; border-radius: 4px; }
.pop-close:focus-visible, .list button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.chip { justify-self: start; font: 700 11px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; color: var(--chip-ink); }
.chip.owned { background: var(--owned); }
.chip.priority { background: var(--priority); }
.chip.target { background: var(--target); }
.intent { border-left: 3px solid var(--target); padding: 4px 0 4px 10px; }
.intent.priority { border-color: var(--priority); }
.intent.owned { border-color: var(--owned); }
.intent .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.intent .v { font-weight: 600; }
.intent .v.tbd { font-weight: 400; font-style: italic; color: var(--muted); }
dl.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.permit { display: block; }
.permit + .permit { margin-top: 4px; }
@media (max-width: 720px) {
  .pop { position: fixed; left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto; max-height: 70vh; overflow-y: auto; border-radius: 12px 12px 0 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
}

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.panel h3 { font: 800 19px/1.1 var(--font-display); font-stretch: 85%; margin: 0; display: flex; align-items: baseline; gap: 8px; }
.panel h3 .key { width: 12px; height: 12px; border-radius: 2px; flex: none; align-self: center; }
.panel .sub { font-size: 13.5px; color: var(--muted); margin: 0; }
ol.list, ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
#list-priority { gap: 0; }
#list-priority li + li { border-top: 1px solid var(--rule); }
#list-priority button { padding-block: 11px; }
.more ul.list { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px 16px; }
.list button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; width: 100%; height: 100%; padding: 9px 8px; border-radius: 4px; cursor: pointer; align-content: start; }
.list button:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.list button.active { background: color-mix(in srgb, var(--select) 40%, transparent); box-shadow: inset 4px 0 0 var(--select-edge); }
.rank { grid-row: span 3; font: 800 26px/1 var(--font-display); color: var(--priority); min-width: 22px; padding-top: 2px; }
.dot { grid-row: span 3; width: 10px; height: 10px; margin-top: 7px; border-radius: 2px; background: var(--target); }
.dot.owned { background: var(--owned); }
.li-title { font-weight: 600; }
.li-where { font-size: 13px; color: var(--muted); }
.li-use { font-size: 14px; }
.li-use.tbd { font-style: italic; color: var(--muted); }

footer { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
footer p { margin: 0; }
@media (prefers-reduced-motion: no-preference) { .list button, .layer { transition: background-color 0.15s, opacity 0.15s; } }
</style>

const SVG_NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("plat");
const stage = document.getElementById("stage");
const pop = document.getElementById("pop");
const popBody = document.getElementById("pop-body");
const lotById = new Map(DATA.lots.map((lot) => [lot.id, lot]));
const pathById = new Map();
const LABELS = { owned: "Owned by CJ Park", priority: "Priority", target: "Future opportunity" };

function esc(text) {
  return String(text ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function formatDate(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}
function houseNumber(lot) {
  const match = (lot.address || "").match(/^(\d+)/);
  return match ? Number(match[1]) : 99999;
}
function streetName(lot) {
  return (lot.address || "").replace(/^[\d\s/]+/, "");
}
function statusLabel(lot) {
  if (lot.status === "priority") return `Priority ${lot.priority}`;
  return LABELS[lot.status] || "";
}

/* Header and footer */
document.getElementById("eyebrow").textContent = DATA.plan.organization;
const titleEl = document.getElementById("title");
const keep = DATA.plan.titleKeepTogether;
if (keep && DATA.plan.title.includes(keep)) {
  const [before, after] = DATA.plan.title.split(keep);
  titleEl.innerHTML = `${esc(before)}<span class="keep">${esc(keep)}</span>${esc(after)}`;
} else {
  titleEl.textContent = DATA.plan.title;
}
document.getElementById("intro").textContent = DATA.plan.intro;
document.getElementById("footer").innerHTML = `
  <p>Map: ${esc(DATA.plat.title)}, ${esc(DATA.plat.issuer)}, dated October 1929. ${esc(DATA.plat.notice)}</p>
  <p>Lot lines, vacancy notices, sales, and permits: Baltimore City, as of ${esc(formatDate(DATA.dataRetrieved))}. Owner names are shown only for public owners.</p>
  <p>This is CJ Park's plan for the neighborhood. This is not an offer to buy property. Plans and priorities may change depending on opportunities and market conditions.</p>`;

/* Plat image, street labels, and lots. The image is fixed: the viewBox frames the crop plus a margin for street names. */
const [ix, iy, iw, ih] = DATA.view;
const margin = iw * 0.07;
svg.setAttribute("viewBox", [ix - margin, iy - margin, iw + margin * 2, ih + margin * 2].join(" "));
const img = document.getElementById("plat-image");
img.setAttribute("x", ix); img.setAttribute("y", iy);
img.setAttribute("width", iw); img.setAttribute("height", ih);

const bounds = DATA.block.bounds;
const streetSpecs = [
  [bounds.north, ix + iw / 2, iy - margin / 2, 0],
  [bounds.south, ix + iw / 2, iy + ih + margin / 2, 0],
  [bounds.west, ix - margin / 2, iy + ih / 2, -90],
  [bounds.east, ix + iw + margin / 2, iy + ih / 2, 90],
];
const streetLayer = document.getElementById("streets");
for (const [name, x, y, angle] of streetSpecs) {
  const text = document.createElementNS(SVG_NS, "text");
  text.setAttribute("class", "street");
  text.setAttribute("x", x); text.setAttribute("y", y);
  if (angle) text.setAttribute("transform", `rotate(${angle} ${x} ${y})`);
  text.textContent = name;
  streetLayer.appendChild(text);
}

const lotsLayer = document.getElementById("lots");
const badgeLayer = document.getElementById("badges");
for (const lot of DATA.lots) {
  const path = document.createElementNS(SVG_NS, "path");
  path.setAttribute("d", "M" + lot.polygon.map((p) => p.join(",")).join("L") + "Z");
  path.setAttribute("class", `lot ${lot.status}`);
  path.dataset.id = lot.id;
  if (lot.status !== "none") {
    path.setAttribute("tabindex", "0");
    path.setAttribute("role", "button");
    path.setAttribute("aria-label", `${lot.name}, ${statusLabel(lot)}`);
  }
  lotsLayer.appendChild(path);
  pathById.set(lot.id, path);
  if (lot.status === "priority") {
    const g = document.createElementNS(SVG_NS, "g");
    g.setAttribute("class", "badge");
    g.dataset.id = lot.id;
    g.innerHTML = `<circle cx="${lot.label[0]}" cy="${lot.label[1]}" r="22"></circle><text x="${lot.label[0]}" y="${lot.label[1]}">${lot.priority}</text>`;
    badgeLayer.appendChild(g);
  }
}

/* Layer toggles */
for (const key of ["owned", "priority", "target"]) {
  document.getElementById(`count-${key}`).textContent = DATA.lots.filter((lot) => lot.status === key).length;
  document.getElementById(`layer-${key}`).addEventListener("change", (event) => {
    svg.classList.toggle(`hide-${key}`, !event.target.checked);
  });
}

/* Selection and popup */
let activeButton = null;
const selectionLayer = document.getElementById("selection");
function clearSelection() {
  for (const path of pathById.values()) path.classList.remove("selected");
  for (const badge of badgeLayer.children) badge.classList.remove("selected");
  selectionLayer.replaceChildren();
  svg.classList.remove("has-selection");
  if (activeButton) activeButton.classList.remove("active");
  activeButton = null;
  pop.hidden = true;
}
function selectLots(ids, at, button, popupId) {
  clearSelection();
  svg.classList.add("has-selection");
  for (const cls of ["sel-glow", "sel-edge", "sel-line"]) {
    for (const id of ids) {
      const outline = document.createElementNS(SVG_NS, "path");
      outline.setAttribute("d", pathById.get(id).getAttribute("d"));
      outline.setAttribute("class", cls);
      selectionLayer.appendChild(outline);
    }
  }
  for (const id of ids) pathById.get(id)?.classList.add("selected");
  for (const badge of badgeLayer.children) {
    if (ids.includes(badge.dataset.id)) badge.classList.add("selected");
  }
  // Keeps the rank numbers above the selection outline.
  svg.appendChild(badgeLayer);
  if (button) { activeButton = button; button.classList.add("active"); }
  const showId = popupId || (ids.length === 1 ? ids[0] : null);
  if (showId && at) showPop(lotById.get(showId), at);
}
svg.addEventListener("click", (event) => {
  const target = event.target.closest(".lot");
  if (target) selectLots([target.dataset.id], { x: event.clientX, y: event.clientY });
  else clearSelection();
});
svg.addEventListener("keydown", (event) => {
  const target = event.target.closest(".lot");
  if (target && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    const box = target.getBoundingClientRect();
    selectLots([target.dataset.id], { x: box.left + box.width / 2, y: box.top + box.height / 2 });
  }
});
document.getElementById("pop-close").addEventListener("click", clearSelection);
document.addEventListener("keydown", (event) => { if (event.key === "Escape") clearSelection(); });

function factsFor(lot) {
  const rows = [["Current use", esc(lot.currentUse)], ["Owner", esc(lot.owner)]];
  if (lot.lotSize) rows.push(["Lot size", esc(lot.lotSize)]);
  if (lot.lastTransfer) rows.push(["Last sold", esc(formatDate(lot.lastTransfer))]);
  if (lot.vacantNoticeDate && lot.status !== "none") rows.push(["Vacant notice", `City notice since ${esc(formatDate(lot.vacantNoticeDate))}`]);
  if (lot.permits.length) {
    rows.push(["Recent permits", lot.permits.map((p) => `<span class="permit">${esc(formatDate(p.issued))}: ${esc(p.description)}</span>`).join("")]);
  } else if (lot.status === "none") {
    rows.push(["Recent permits", "None in the last 2 years"]);
  }
  return rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
}
function showPop(lot, at) {
  let intent = "";
  if (lot.status === "priority") {
    const title = DATA.plan.priorityTitles[String(lot.priority)];
    intent = `<div class="intent priority"><div class="k">CJ Park's plan · Priority ${lot.priority}${title && title !== lot.name ? ": " + esc(title) : ""}</div><div class="v">${esc(lot.proposedUse)}</div></div>`;
  } else if (lot.status === "target") {
    intent = lot.proposedUse
      ? `<div class="intent"><div class="k">What CJ Park hopes for</div><div class="v">${esc(lot.proposedUse)}</div></div>`
      : `<div class="intent"><div class="k">What CJ Park hopes for</div><div class="v tbd">To see it fixed up and used again. What it becomes is not decided yet.</div></div>`;
  } else if (lot.status === "owned") {
    intent = `<div class="intent owned"><div class="k">CJ Park owns this land</div><div class="v">${esc(lot.proposedUse || lot.currentUse)}</div></div>`;
  }
  const chip = lot.status === "none" ? "" : `<span class="chip ${lot.status}">${esc(statusLabel(lot))}</span>`;
  popBody.innerHTML = `
    <div class="pop-head">${chip}<h2 id="pop-title">${esc(lot.name)}</h2>
      <div class="blocklot">Block ${esc(DATA.plat.block)} · Lot ${esc(lot.lot)}${lot.address && lot.address !== lot.name ? " · " + esc(lot.address) : ""}</div></div>
    ${intent}
    <dl class="facts">${factsFor(lot)}</dl>`;
  pop.hidden = false;
  placePopBeside(pathById.get(lot.id).getBoundingClientRect());
}
/* Puts the popup next to the lot, never on it: right side, then left side, then below or above. */
function placePopBeside(lotRect) {
  const stageRect = stage.getBoundingClientRect();
  const width = pop.offsetWidth;
  const height = pop.offsetHeight;
  const gap = 14;
  const edge = 8;
  const lot = {
    left: lotRect.left - stageRect.left, right: lotRect.right - stageRect.left,
    top: lotRect.top - stageRect.top, bottom: lotRect.bottom - stageRect.top,
  };
  const clampTop = (value) => Math.min(Math.max(edge, value), Math.max(edge, stageRect.height - height - edge));
  const clampLeft = (value) => Math.min(Math.max(edge, value), Math.max(edge, stageRect.width - width - edge));
  let left;
  let top;
  if (stageRect.width - lot.right >= width + gap + edge) {
    left = lot.right + gap;
    top = clampTop(lot.top + (lot.bottom - lot.top) / 2 - height / 2);
  } else if (lot.left >= width + gap + edge) {
    left = lot.left - width - gap;
    top = clampTop(lot.top + (lot.bottom - lot.top) / 2 - height / 2);
  } else {
    left = clampLeft(lot.left + (lot.right - lot.left) / 2 - width / 2);
    top = lot.bottom + gap + height <= stageRect.height - edge ? lot.bottom + gap : Math.max(edge, lot.top - gap - height);
  }
  pop.style.left = `${left}px`;
  pop.style.top = `${top}px`;
}

function pickFromList(ids, button, popupId) {
  // A second click on the open list item closes it.
  if (button === activeButton) { clearSelection(); return; }
  const narrow = window.matchMedia("(max-width: 900px)").matches;
  const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const box = svg.getBoundingClientRect();
  const offscreen = box.top < 0 || box.bottom > window.innerHeight;
  if (narrow || offscreen) stage.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  setTimeout(() => {
    let at = null;
    const showId = popupId || (ids.length === 1 ? ids[0] : null);
    if (showId) {
      const lotBox = pathById.get(showId).getBoundingClientRect();
      at = { x: lotBox.left + lotBox.width / 2, y: lotBox.top + lotBox.height / 2 };
    }
    selectLots(ids, at, button, showId);
  }, narrow || offscreen ? 350 : 0);
}

/* Lists */
function listItem(lead, title, where, use, ids, popupId) {
  const li = document.createElement("li");
  const button = document.createElement("button");
  button.type = "button";
  button.innerHTML = `${lead}<span class="li-title">${esc(title)}</span><span class="li-where">${esc(where)}</span>` +
    (use === null ? "" : `<span class="li-use${use ? "" : " tbd"}">${esc(use || "Use not decided yet")}</span>`);
  button.addEventListener("click", () => pickFromList(ids, button, popupId));
  li.appendChild(button);
  return li;
}
function lotRange(lots) {
  const numbers = lots.map((lot) => Number(lot.lot)).sort((a, b) => a - b);
  return numbers.length > 1 ? `Lots ${numbers[0]}–${numbers[numbers.length - 1]}` : `Lot ${numbers[0]}`;
}

/* A priority's property line: the addresses for several lots, or the current use for one lot. */
function describePriority(lots) {
  if (lots.length === 1) return lots[0].currentUse;
  const numbers = lots.map(houseNumber);
  const joined = numbers.length === 2 ? numbers.join(" and ") : `${numbers.slice(0, -1).join(", ")}, and ${numbers[numbers.length - 1]}`;
  return `${joined} ${streetName(lots[0])}`;
}

const priorityGroups = new Map();
for (const lot of DATA.lots.filter((l) => l.status === "priority")) {
  if (!priorityGroups.has(lot.priority)) priorityGroups.set(lot.priority, []);
  priorityGroups.get(lot.priority).push(lot);
}
const priorityList = document.getElementById("list-priority");
for (const rank of [...priorityGroups.keys()].sort((a, b) => a - b)) {
  const lots = priorityGroups.get(rank).sort((a, b) => houseNumber(a) - houseNumber(b));
  const title = DATA.plan.priorityTitles[String(rank)] || lots[0].name;
  const popupId = (DATA.plan.priorityPopupLots || {})[String(rank)] || null;
  const use = lots[0].proposedUse ? `Future Use: ${lots[0].proposedUse}.` : "";
  priorityList.appendChild(listItem(`<span class="rank">${rank}</span>`, title, describePriority(lots), use, lots.map((l) => l.id), popupId));
}

const ownedList = document.getElementById("list-owned");
for (const lot of DATA.lots.filter((l) => l.status === "owned")) {
  ownedList.appendChild(listItem('<span class="dot owned"></span>', lot.name, `${lotRange([lot])} · ${lot.currentUse}`, null, [lot.id]));
}

const targetEntries = [];
const grouped = new Map();
for (const lot of DATA.lots.filter((l) => l.status === "target")) {
  if (lot.group) {
    if (!grouped.has(lot.group)) grouped.set(lot.group, []);
    grouped.get(lot.group).push(lot);
  } else {
    targetEntries.push({ title: lot.name, where: `${lotRange([lot])} · ${lot.currentUse}`, use: lot.proposedUse, ids: [lot.id], sort: [streetName(lot), houseNumber(lot)] });
  }
}
for (const [key, lots] of grouped) {
  const uses = new Set(lots.map((l) => l.currentUse));
  targetEntries.push({
    title: DATA.plan.groups[key] || lotRange(lots),
    where: `${lotRange(lots)} · ${lots.length} lots · ${uses.size === 1 ? [...uses][0] : "Mixed"}`,
    use: lots[0].proposedUse, ids: lots.map((l) => l.id), sort: [streetName(lots[0]), Math.min(...lots.map(houseNumber))],
  });
}
targetEntries.sort((a, b) => a.sort[0].localeCompare(b.sort[0]) || a.sort[1] - b.sort[1]);
const targetList = document.getElementById("list-target");
for (const entry of targetEntries) targetList.appendChild(listItem('<span class="dot"></span>', entry.title, entry.where, entry.use, entry.ids));
</script>
